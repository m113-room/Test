<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework M.113</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body { 
      font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #fbcfe8 0%, #e9d5ff 50%, #bae6fd 100%);
    }

    .hidden { display: none !important; }

    .app-layout {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 14px 20px 14px;
    }

    .app-card {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-pop { animation: pop .2s ease-out; }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    input, select, textarea { outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #ec4899 !important; box-shadow: 0 0 0 2px rgba(236, 72, 153, 0.2); }
  </style>
</head>

<body>

  <div id="loading-overlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[100] hidden flex items-center justify-center">
    <div class="bg-white rounded-3xl p-6 shadow-2xl text-center min-w-[180px]">
      <div class="w-8 h-8 border-4 border-pink-400 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
      <p id="loading-text" class="text-xs font-bold text-slate-600">กำลังอัปโหลดและบันทึก...</p>
    </div>
  </div>

  <div class="app-layout">

    <div></div>

    <!-- Login Page -->
    <div id="login-page" class="app-card max-w-sm bg-white/95 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white text-center">
      <div class="w-16 h-16 mx-auto bg-gradient-to-br from-pink-500 via-purple-500 to-indigo-500 rounded-2xl flex items-center justify-center text-white text-3xl mb-4 shadow-lg shadow-purple-200">
        <i class="fa-solid fa-book-open-reader"></i>
      </div>

      <h1 class="text-xl font-extrabold text-slate-800 mb-1">Homework M.113</h1>
      <p class="text-[11px] text-slate-500 font-bold mb-6">ระบบการบ้านห้อง M.113</p>

      <div class="text-left mb-4">
        <label class="text-[11px] font-bold text-slate-600 ml-1">ชื่อผู้ใช้งาน (USERNAME)</label>
        <input id="username" type="text" placeholder="พิมพ์ชื่อผู้ใช้งานของคุณ"
          class="w-full mt-1 p-3 rounded-2xl bg-slate-50 border border-slate-200 text-sm font-semibold text-slate-700 transition"
          onkeydown="if(event.key==='Enter')login()">
      </div>

      <button id="login-btn" onclick="login()"
        class="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-2xl font-extrabold text-sm shadow-md shadow-pink-200 hover:opacity-95 transition">
        เข้าสู่ระบบทันที
      </button>
    </div>

    <!-- Main Page -->
    <main id="main-page" class="app-card hidden max-w-md bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 border border-white">

      <header class="flex items-center justify-between mb-4">
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-extrabold text-pink-500 text-lg">HOMEWORK</h1>
            <span class="bg-slate-800 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-md">M113</span>
          </div>
          <span id="user-display" class="inline-block mt-1 text-[11px] font-extrabold text-pink-600 bg-pink-50 px-2.5 py-0.5 rounded-full border border-pink-100"></span>
        </div>

        <div class="flex items-center gap-1.5">
          <button id="btn-logs" onclick="openLogs()" title="ประวัติการใช้งาน" class="w-8 h-8 rounded-full bg-pink-50 text-pink-600 items-center justify-center text-xs hover:bg-pink-100 transition hidden">
            <i class="fa-solid fa-clock-rotate-left"></i>
          </button>
          <button id="btn-options" onclick="openOptions()" title="จัดการวิชา" class="w-8 h-8 rounded-full bg-sky-50 text-sky-600 items-center justify-center text-xs hover:bg-sky-100 transition hidden">
            <i class="fa-solid fa-list-check"></i>
          </button>
          <button onclick="loadAllData(true)" title="รีเฟรช" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-xs hover:bg-slate-200 transition">
            <i class="fa-solid fa-rotate"></i>
          </button>
          <button onclick="logout()" class="px-3 py-1.5 bg-rose-50 text-rose-500 rounded-xl text-[11px] font-extrabold hover:bg-rose-100 transition ml-1">
            LOGOUT
          </button>
        </div>
      </header>

      <div id="sync-status" class="bg-slate-50 text-slate-600 p-2.5 rounded-2xl text-[11px] font-bold mb-4 text-center border border-slate-100">
        <i class="fa-solid fa-circle-info"></i> พร้อมใช้งาน
      </div>

      <nav class="grid grid-cols-3 gap-1 bg-slate-100/80 rounded-2xl p-1 mb-4 text-center">
        <button id="tab-pending" onclick="switchTab('pending')" class="py-2.5 rounded-xl text-xs font-extrabold transition">ภาพรวมงานค้าง</button>
        <button id="tab-calendar" onclick="switchTab('calendar')" class="py-2.5 rounded-xl text-xs font-extrabold transition">ปฏิทินงาน</button>
        <button id="tab-tracking" onclick="switchTab('tracking')" class="py-2.5 rounded-xl text-xs font-extrabold transition">งานค้าง</button>
      </nav>

      <!-- Filter & Search Bar -->
      <div id="filter-container" class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 mb-4 space-y-3 shadow-sm">
        <div class="flex items-center gap-2">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input id="search-keyword" type="text" placeholder="ค้นหาชื่อวิชา, รหัส หรือรายละเอียด..." oninput="renderTasks()"
              class="w-full pl-8 pr-3 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-700">
          </div>
          <select id="filter-subject" onchange="renderTasks()"
            class="w-32 py-2.5 px-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-700">
            <option value="">ทุกวิชา</option>
          </select>
        </div>

        <div class="flex items-center gap-2 pt-2 border-t border-slate-200/60">
          <span class="text-[11px] font-bold text-slate-500"><i class="fa-solid fa-filter"></i> เรียงตาม:</span>
          <select id="filter-date-mode" onchange="renderTasks()"
            class="flex-1 py-2 px-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-700">
            <option value="all">ค่าเริ่มต้น (สร้างล่าสุด)</option>
            <option value="due-soon">กำหนดส่งใกล้ที่สุด (เร็วไปช้า)</option>
            <option value="assign-new">วันที่สั่งล่าสุด (ใหม่ไปเก่า)</option>
          </select>
        </div>
      </div>

      <!-- Tab Views -->
      <section id="view-pending">
        <div class="bg-amber-50/70 border border-amber-100 rounded-2xl p-3.5 mb-4">
          <h2 class="text-xs font-extrabold text-amber-600 mb-2 flex items-center gap-1.5">
            <i class="fa-solid fa-thumbtack"></i> ปักหมุดไว้
          </h2>
          <div id="pinned-list" class="space-y-2"></div>
        </div>

        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xs font-extrabold text-pink-500">ภาพรวมงานค้าง</h2>
          <span id="task-count" class="text-[10px] font-extrabold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-full">0 ITEMS</span>
        </div>

        <div id="admin-action-box" class="mb-4 hidden">
          <button onclick="toggleAddTaskModal(true)" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-extrabold py-3 rounded-2xl text-xs shadow-md shadow-pink-200 hover:opacity-95 transition">
            <i class="fa-solid fa-plus"></i> เพิ่มการบ้านใหม่ (พร้อมแนบรูป)
          </button>
        </div>

        <div id="task-list" class="space-y-2.5"></div>
      </section>

      <section id="view-calendar" class="hidden">
        <button onclick="toggleForm('event-form')" class="w-full bg-[#38bdf8] text-white font-extrabold py-3 rounded-2xl text-xs mb-4 shadow-sm hover:opacity-95 transition">
          + เพิ่มกิจกรรม
        </button>

        <div id="event-form" class="hidden bg-sky-50 border border-sky-100 rounded-2xl p-3.5 mb-4 space-y-2.5">
          <input id="event-input" class="w-full border rounded-xl p-2.5 text-xs bg-white" placeholder="ชื่อกิจกรรม">
          <button onclick="addEvent()" class="w-full bg-sky-500 text-white rounded-xl py-2 text-xs font-bold">บันทึกกิจกรรม</button>
        </div>

        <div class="flex justify-between items-center mb-3">
          <h2 id="calendar-month-year" class="text-xs font-extrabold text-slate-700"></h2>
          <div class="flex gap-1 text-[10px] font-bold">
            <button onclick="changeMonth(-1)" class="bg-slate-100 px-2.5 py-1 rounded-lg text-slate-600">PREV</button>
            <button onclick="changeMonth(1)" class="bg-slate-100 px-2.5 py-1 rounded-lg text-slate-600">NEXT</button>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-3.5 border border-slate-100 shadow-sm mb-4">
          <div class="grid grid-cols-7 text-center text-[10px] font-extrabold mb-2">
            <span style="color: #ef4444;">SUN</span>
            <span style="color: #eab308;">MON</span>
            <span style="color: #ec4899;">TUE</span>
            <span style="color: #22c55e;">WED</span>
            <span style="color: #f97316;">THU</span>
            <span style="color: #3b82f6;">FRI</span>
            <span style="color: #a855f7;">SAT</span>
          </div>
          <div id="calendar-days" class="grid grid-cols-7 gap-1.5"></div>
        </div>
      </section>

      <section id="view-tracking" class="hidden">
        <div class="bg-slate-50/60 border border-slate-100 rounded-2xl p-3.5 text-center text-xs text-slate-500">
          ระบบติดตามสถานะการส่งการบ้าน
        </div>
      </section>

    </main>

    <!-- Modal เพิ่มการบ้าน (รองรับรูปภาพ) -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-slate-100 animate-pop">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-extrabold text-slate-800 text-sm"><i class="fa-solid fa-plus-circle text-pink-500"></i> เพิ่มการบ้านใหม่</h3>
          <button onclick="toggleAddTaskModal(false)" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-base"></i></button>
        </div>
        <form onsubmit="handleAddTask(event)" class="space-y-3">
          <div>
            <label class="text-[11px] font-bold text-slate-600">รหัสวิชา / ชื่อวิชา</label>
            <input id="new-task-subject" type="text" required placeholder="เช่น TH101 ภาษาไทย" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold">
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-600">รายละเอียดงาน</label>
            <textarea id="new-task-desc" required rows="2" placeholder="รายละเอียดการบ้าน..." class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold"></textarea>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-600">กำหนดส่ง</label>
            <input id="new-task-due" type="date" required class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold">
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-600">แนบรูปภาพประกอบ (ถ้ามี)</label>
            <input id="new-task-file" type="file" accept="image/*" class="w-full mt-1 text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-pink-50 file:text-pink-600 hover:file:bg-pink-100">
          </div>
          <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-xl font-extrabold text-xs shadow-md shadow-pink-200 hover:opacity-95 transition mt-2">
            บันทึกการบ้าน
          </button>
        </form>
      </div>
    </div>

    <!-- Embedded Popup Modal -->
    <div id="modal-popup" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[110] hidden flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl text-center space-y-3 animate-pop">
        <div id="modal-icon" class="text-3xl text-pink-500">✅</div>
        <h3 id="modal-title" class="font-extrabold text-slate-800 text-sm">สำเร็จ</h3>
        <p id="modal-message" class="text-xs text-slate-600">ดำเนินการเรียบร้อยแล้ว</p>
        <button onclick="closeModal()" class="w-full py-2.5 bg-pink-500 text-white rounded-xl font-extrabold text-xs shadow-md shadow-pink-200">ตกลง</button>
      </div>
    </div>

    <footer class="text-center text-[10px] font-bold text-slate-500/80 mt-4">
      M113-Room Homework System &copy; 2026
    </footer>

  </div>

  <script>
    // ⚠️ ใส่ Web App URL ของคุณที่ได้จากการ Deploy Apps Script ตรงนี้
    const API_URL = "ใส่_Web_App_URL_ของคุณตรงนี้";
    let currentUser = null;
    let appData = { tasks: [], events: {} };

    async function login() {
      const username = document.getElementById('username').value.trim();
      if (!username) return alert('กรุณากรอกชื่อผู้ใช้งาน');
      
      showLoading(true, 'กำลังเข้าสู่ระบบ...');
      try {
        const res = await fetch(`${API_URL}?action=checkLogin&username=${encodeURIComponent(username)}`);
        const result = await res.json();
        if (result.success) {
          currentUser = result.user;
          document.getElementById('login-page').classList.add('hidden');
          document.getElementById('main-page').classList.remove('hidden');
          document.getElementById('user-display').innerText = `${currentUser.name} (${currentUser.role})`;
          
          if (currentUser.role === 'admin') {
            document.getElementById('admin-action-box').classList.remove('hidden');
            document.getElementById('btn-logs').classList.remove('hidden');
            document.getElementById('btn-options').classList.remove('hidden');
          }
          await loadAllData(false);
        } else {
          alert(result.error || 'ไม่พบบัญชีผู้ใช้');
        }
      } catch(e) {
        currentUser = { username: username, role: username.toLowerCase() === 'admin' ? 'admin' : 'member', name: username };
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('main-page').classList.remove('hidden');
        document.getElementById('user-display').innerText = `${currentUser.name} (${currentUser.role})`;
        if (currentUser.role === 'admin') {
          document.getElementById('admin-action-box').classList.remove('hidden');
          document.getElementById('btn-logs').classList.remove('hidden');
        }
        renderTasks([
          { id: 1, subject: "TH101 ภาษาไทย", desc: "คัดลายมือบทที่ 3", dueDate: "2026-11-10", imageUrl: "" }
        ]);
      } finally {
        showLoading(false);
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById('main-page').classList.add('hidden');
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('username').value = '';
    }

    async function loadAllData(showMsg = true) {
      if (showMsg) showLoading(true, 'กำลังโหลดข้อมูล...');
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        appData.tasks = data.tasks || [];
        appData.events = data.events || {};
        renderTasks(appData.tasks);
        renderCalendar();
        if (showMsg) showModal("สำเร็จ", "อัปเดตข้อมูลล่าสุดเรียบร้อยแล้ว");
      } catch(e) {
        console.log("Using local data cache");
      } finally {
        if (showMsg) showLoading(false);
      }
    }

    function switchTab(tab) {
      ['pending', 'calendar', 'tracking'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "py-2.5 rounded-xl text-xs font-extrabold text-slate-500 transition";
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "py-2.5 rounded-xl text-xs font-extrabold bg-white text-pink-600 shadow-sm transition";
      
      if (tab === 'calendar') renderCalendar();
    }

    function renderTasks(tasksToRender) {
      const list = tasksToRender || appData.tasks;
      const container = document.getElementById('task-list');
      const countEl = document.getElementById('task-count');
      if (countEl) countEl.innerText = `${list.length} ITEMS`;

      if (list.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border border-slate-100">ไม่มีรายการการบ้าน</div>`;
        return;
      }

      container.innerHTML = list.map(t => `
        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-start justify-between gap-3">
          <div class="space-y-1">
            <span class="inline-block bg-pink-50 text-pink-600 text-[10px] font-extrabold px-2 py-0.5 rounded-md">${t.subject}</span>
            <h4 class="text-xs font-bold text-slate-800">${t.desc}</h4>
            <p class="text-[10px] text-slate-500 font-semibold"><i class="fa-solid fa-calendar"></i> กำหนดส่ง: ${t.dueDate}</p>
          </div>
          ${t.imageUrl ? `<a href="${t.imageUrl}" target="_blank"><img src="${t.imageUrl}" class="w-14 h-14 object-cover rounded-xl border border-slate-200 hover:opacity-95 transition" title="ดูรูปภาพ"></a>` : ''}
        </div>
      `).join('');
    }

    function toggleAddTaskModal(show) {
      const modal = document.getElementById('task-modal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    }

    function toggleForm(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('hidden');
    }

    async function handleAddTask(e) {
      e.preventDefault();
      const subject = document.getElementById('new-task-subject').value;
      const desc = document.getElementById('new-task-desc').value;
      const dueDate = document.getElementById('new-task-due').value;
      const fileInput = document.getElementById('new-task-file');

      let imageObj = null;
      if (fileInput && fileInput.files.length > 0) {
        const file = fileInput.files[0];
        imageObj = await toBase64(file);
      }

      const newTask = { id: Date.now(), subject, desc, dueDate, imageObj };
      appData.tasks.push(newTask);

      showLoading(true, 'กำลังอัปโหลดรูปภาพและบันทึกข้อมูล...');
      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'saveTasks', tasks: appData.tasks })
        });
        toggleAddTaskModal(false);
        document.getElementById('new-task-subject').value = '';
        document.getElementById('new-task-desc').value = '';
        document.getElementById('new-task-due').value = '';
        if (fileInput) fileInput.value = '';
        renderTasks(appData.tasks);
        showModal("สำเร็จ", "บันทึกการบ้านและอัปโหลดรูปภาพเรียบร้อยแล้ว");
      } catch(err) {
        showModal("แจ้งเตือน", "เกิดข้อผิดพลาดในการบันทึก", "❌");
      } finally {
        showLoading(false);
      }
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({ name: file.name, type: file.type, data: reader.result });
        reader.onerror = error => reject(error);
      });
    }

    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();
    const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];

    function renderCalendar() {
      const title = document.getElementById('calendar-month-year');
      if (title) title.innerText = `${thaiMonths[currentMonth]} ${currentYear + 543}`;
      const daysContainer = document.getElementById('calendar-days');
      if (!daysContainer) return;
      
      daysContainer.innerHTML = '';
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        daysContainer.innerHTML += `<div></div>`;
      }
      for (let d = 1; d <= totalDays; d++) {
        daysContainer.innerHTML += `<div class="h-10 rounded-xl bg-slate-50 border border-slate-100 flex flex-col items-center justify-center text-xs font-bold text-slate-700">${d}</div>`;
      }
    }

    function changeMonth(dir) {
      currentMonth += dir;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    }

    function showLoading(show, text = "กำลังประมวลผล...") {
      const overlay = document.getElementById('loading-overlay');
      document.getElementById('loading-text').innerText = text;
      if (show) overlay.classList.remove('hidden');
      else overlay.classList.add('hidden');
    }

    function showModal(title, message, icon="✅") {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-message').innerText = message;
      document.getElementById('modal-icon').innerText = icon;
      document.getElementById('modal-popup').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-popup').classList.add('hidden');
    }

    switchTab('pending');
  </script>
</body>
</html>
