<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework M.113</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; margin: 0; background: linear-gradient(135deg, #fbcfe8 0%, #e9d5ff 50%, #bae6fd 100%); min-height: 100dvh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 12px; }
    .hidden { display: none !important; }
    @keyframes pop { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
    .animate-pop { animation: pop .2s ease-out; }
    input, select { outline: none; }
    input:focus, select:focus { border-color: #ec4899 !important; box-shadow: 0 0 0 2px rgba(236, 72, 153, 0.2); }
  </style>
</head>
<body>

  <div id="loading-overlay" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-[100] hidden flex items-center justify-center">
    <div class="bg-white rounded-3xl p-6 shadow-2xl text-center"><div class="w-8 h-8 border-4 border-pink-400 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div><p id="loading-text" class="text-xs font-bold text-slate-600">กำลังโหลด...</p></div>
  </div>

  <div></div>

  <!-- Login Page -->
  <div id="login-page" class="w-full max-w-sm mx-auto bg-white/95 backdrop-blur-xl rounded-3xl p-6 shadow-2xl border border-white text-center">
    <div class="w-14 h-14 mx-auto bg-gradient-to-br from-pink-500 to-indigo-500 rounded-2xl flex items-center justify-center text-white text-2xl mb-3 shadow-md"><i class="fa-solid fa-book-open-reader"></i></div>
    <h1 class="text-lg font-extrabold text-slate-800">Homework M.113</h1>
    <p class="text-[11px] text-slate-500 font-bold mb-5">ระบบการบ้านห้อง M.113</p>
    <div class="text-left mb-3">
      <label class="text-[10px] font-bold text-slate-600 ml-1">USERNAME</label>
      <input id="username" type="text" placeholder="พิมพ์ชื่อผู้ใช้งาน" class="w-full mt-1 p-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button onclick="login()" class="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-2xl font-extrabold text-xs shadow-md shadow-pink-200">เข้าสู่ระบบทันที</button>
  </div>

  <!-- Main Page -->
  <main id="main-page" class="w-full max-w-md mx-auto hidden bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-5 border border-white">
    <header class="flex items-center justify-between mb-3">
      <div>
        <div class="flex items-center gap-1.5"><h1 class="font-extrabold text-pink-500 text-base">HOMEWORK</h1><span class="bg-slate-800 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">M113</span></div>
        <span id="user-display" class="inline-block mt-0.5 text-[10px] font-extrabold text-pink-600 bg-pink-50 px-2 py-0.5 rounded-full border border-pink-100"></span>
      </div>
      <div class="flex items-center gap-1">
        <button id="btn-logs" onclick="openLogs()" title="ประวัติ" class="w-7 h-7 rounded-full bg-pink-50 text-pink-600 flex items-center justify-center text-xs hidden"><i class="fa-solid fa-clock-rotate-left"></i></button>
        <button id="btn-options" onclick="openOptions()" title="จัดการวิชา" class="w-7 h-7 rounded-full bg-sky-50 text-sky-600 flex items-center justify-center text-xs hidden"><i class="fa-solid fa-list-check"></i></button>
        <button onclick="loadAllData(true)" title="รีเฟรช" class="w-7 h-7 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-xs"><i class="fa-solid fa-rotate"></i></button>
        <button onclick="logout()" class="px-2.5 py-1 bg-rose-50 text-rose-500 rounded-xl text-[10px] font-extrabold">LOGOUT</button>
      </div>
    </header>

    <div id="sync-status" class="bg-slate-50 text-slate-600 p-2 rounded-xl text-[10px] font-bold mb-3 text-center border border-slate-100"><i class="fa-solid fa-circle-info"></i> พร้อมใช้งาน</div>

    <nav class="grid grid-cols-3 gap-1 bg-slate-100 rounded-2xl p-1 mb-3 text-center">
      <button id="tab-pending" onclick="switchTab('pending')" class="py-2 rounded-xl text-xs font-extrabold transition">ภาพรวม</button>
      <button id="tab-calendar" onclick="switchTab('calendar')" class="py-2 rounded-xl text-xs font-extrabold transition">ปฏิทิน</button>
      <button id="tab-tracking" onclick="switchTab('tracking')" class="py-2 rounded-xl text-xs font-extrabold transition">งานค้าง</button>
    </nav>

    <!-- Filter & Search Bar -->
    <div id="filter-container" class="bg-slate-50 border border-slate-200 rounded-2xl p-2.5 mb-3 space-y-2">
      <div class="flex items-center gap-1.5">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px]"></i>
          <input id="search-keyword" type="text" placeholder="ค้นหาชื่อวิชา หรือรายละเอียด..." oninput="renderTasks()" class="w-full pl-7 pr-2 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-700">
        </div>
        <select id="filter-subject" onchange="renderTasks()" class="w-28 py-1.5 px-1 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-700"><option value="">ทุกวิชา</option></select>
      </div>
      <div class="flex items-center gap-1.5 pt-1 border-t border-slate-200">
        <span class="text-[10px] font-bold text-slate-500">เรียงตาม:</span>
        <select id="filter-date-mode" onchange="renderTasks()" class="flex-1 py-1 px-1 bg-white border border-slate-200 rounded-xl text-[11px] font-semibold text-slate-700">
          <option value="all">ค่าเริ่มต้น</option>
          <option value="due-soon">กำหนดส่งใกล้ที่สุด</option>
          <option value="assign-new">วันที่สั่งล่าสุด</option>
        </select>
      </div>
    </div>

    <!-- View: Pending -->
    <section id="view-pending">
      <div class="bg-amber-50/70 border border-amber-100 rounded-2xl p-3 mb-3">
        <h2 class="text-xs font-extrabold text-amber-600 mb-1.5"><i class="fa-solid fa-thumbtack"></i> ปักหมุดไว้</h2>
        <div id="pinned-list" class="space-y-2"></div>
      </div>
      <div class="flex justify-between items-center mb-2"><h2 class="text-xs font-extrabold text-pink-500">ภาพรวมงานค้าง</h2><span id="task-count" class="text-[9px] font-extrabold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-full">0 ITEMS</span></div>
      <div id="task-list" class="space-y-2"></div>
    </section>

    <!-- View: Calendar -->
    <section id="view-calendar" class="hidden">
      <button onclick="toggleForm('event-form')" class="w-full bg-sky-400 text-white font-extrabold py-2.5 rounded-2xl text-xs mb-3 shadow-sm">+ เพิ่มกิจกรรม</button>
      <div id="event-form" class="hidden bg-sky-50 border border-sky-100 rounded-2xl p-3 mb-3 space-y-2">
        <input id="event-input" class="w-full border rounded-xl p-2 text-xs bg-white" placeholder="ชื่อกิจกรรม">
        <button onclick="addEvent()" class="w-full bg-sky-500 text-white rounded-xl py-1.5 text-xs font-bold">บันทึกกิจกรรม</button>
      </div>
      <div class="flex justify-between items-center mb-2"><h2 id="calendar-month-year" class="text-xs font-extrabold text-slate-700"></h2><div class="flex gap-1 text-[10px] font-bold"><button onclick="changeMonth(-1)" class="bg-slate-100 px-2 py-1 rounded-lg">PREV</button><button onclick="changeMonth(1)" class="bg-slate-100 px-2 py-1 rounded-lg">NEXT</button></div></div>
      <div class="bg-white rounded-2xl p-3 border border-slate-100 shadow-sm mb-3">
        <div class="grid grid-cols-7 text-center text-[9px] font-extrabold mb-1.5 text-slate-400"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div>
        <div id="calendar-days" class="grid grid-cols-7 gap-1"></div>
      </div>
      <div class="bg-slate-50 border border-slate-100 rounded-2xl p-3">
        <div class="flex justify-between items-center mb-2"><h3 id="selected-date-label" class="font-extrabold text-xs text-slate-700"></h3><span id="selected-date-count" class="text-[9px] font-extrabold text-slate-600 bg-slate-200 px-2 py-0.5 rounded-full">0 รายการ</span></div>
        <div class="mb-2"><h4 class="text-[10px] font-extrabold text-sky-500 mb-1">★ กิจกรรมในวันนี้</h4><div id="event-list" class="space-y-1"></div></div>
        <div id="selected-date-tasks" class="space-y-2"></div>
      </div>
    </section>

    <!-- View: Tracking -->
    <section id="view-tracking" class="hidden">
      <div class="grid grid-cols-2 gap-2 mb-3">
        <button onclick="toggleForm('task-form')" class="bg-purple-600 text-white font-extrabold py-2 rounded-2xl text-xs shadow-sm">+ เพิ่มการบ้าน</button>
        <button onclick="toggleForm('student-form')" class="bg-blue-600 text-white font-extrabold py-2 rounded-2xl text-xs shadow-sm"><i class="fa-solid fa-user-plus"></i> เพิ่มคนค้าง</button>
      </div>
      <div id="task-form" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-3 mb-3 space-y-2.5">
        <h3 class="text-xs font-bold text-pink-600">เพิ่มรายการการบ้าน</h3>
        <div class="grid grid-cols-2 gap-2">
          <input id="task-code" list="code-options" placeholder="รหัสวิชา" class="w-full p-2 border rounded-xl text-xs bg-white">
          <input id="task-subject" list="subject-options" placeholder="ชื่อวิชา" class="w-full p-2 border rounded-xl text-xs bg-white">
        </div>
        <datalist id="code-options"></datalist><datalist id="subject-options"></datalist>
        <input id="task-detail" placeholder="รายละเอียดการบ้าน" class="w-full p-2 border rounded-xl text-xs bg-white">
        <div class="grid grid-cols-2 gap-2">
          <div class="flex items-center bg-white border rounded-xl px-2 py-1"><span class="text-[9px] font-bold text-slate-400 mr-1">สั่ง:</span><input id="task-assign-date" type="date" class="w-full text-xs bg-transparent border-0 p-0"></div>
          <div class="flex items-center bg-white border rounded-xl px-2 py-1"><span class="text-[9px] font-bold text-slate-400 mr-1">ส่ง:</span><input id="task-due-date" type="date" class="w-full text-xs bg-transparent border-0 p-0"></div>
        </div>
        <button onclick="addTask()" class="w-full bg-purple-600 text-white py-2.5 rounded-xl font-extrabold text-xs">บันทึกข้อมูล</button>
      </div>
      <div id="student-form" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-3 mb-3 space-y-2">
        <h3 class="text-xs font-bold text-pink-600">เพิ่มเลขที่คนค้างงาน</h3>
        <select id="student-task-select" class="w-full p-2 border rounded-xl text-xs bg-white"></select>
        <input id="student-number" type="number" min="1" placeholder="เลขที่นักเรียน" class="w-full p-2 border rounded-xl text-xs bg-white">
        <button onclick="addExtraStudent()" class="w-full bg-blue-600 text-white py-2 rounded-xl font-extrabold text-xs">บันทึก</button>
      </div>
      <div class="flex justify-between items-center mb-2"><h2 class="text-xs font-extrabold text-pink-500">เช็คงานค้าง</h2><span id="tracking-count" class="text-[9px] font-extrabold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-full">0 ITEMS</span></div>
      <div id="tracking-list" class="space-y-2"></div>
    </section>
  </main>

  <div class="w-full text-center pt-2 pb-1">
    <button onclick="showAlert('ระบบส่งการบ้านเปิดใช้งานปกติ')" class="bg-white/95 text-slate-700 text-xs font-bold px-6 py-2 rounded-full border shadow-sm">การส่งการบ้าน</button>
    <div class="mt-1"><span class="text-[9px] text-slate-500 font-bold">(V.2.08 Compact Mode)</span></div>
  </div>

  <div id="modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-4 w-full max-w-sm max-h-[85vh] overflow-y-auto animate-pop shadow-2xl">
      <div class="flex justify-between items-center mb-3 pb-2 border-b"><h3 id="modal-title" class="font-extrabold text-xs text-slate-700"></h3><button onclick="closeModal()" class="text-slate-500 font-bold">✕</button></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <div id="custom-alert" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[120] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 w-full max-w-xs animate-pop shadow-2xl text-center">
      <div class="w-10 h-10 mx-auto bg-pink-50 text-pink-500 rounded-2xl flex items-center justify-center text-lg mb-2"><i class="fa-solid fa-circle-info"></i></div>
      <h3 class="font-extrabold text-xs text-slate-800 mb-1">แจ้งเตือน</h3>
      <p id="alert-text" class="text-xs text-slate-500 font-semibold mb-4"></p>
      <button onclick="closeAlert()" class="w-full bg-pink-500 text-white py-2 rounded-xl text-xs font-extrabold">ปิด</button>
    </div>
  </div>

<script>
'use strict';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPMdLygwBXKBmasT3GM-MsfhlPvaVpd31_epFbbcNFWyGghIBLEevaZO0b5Rbq9c2iQA/exec';
let currentUser = null, tasks = [], dailyEvents = {}, codes = [], subjects = [], currentTab = 'pending', calendarDate = new Date(), selectedDate = dateKey(new Date()), isAllLogsLoaded = false;
const TOTAL_STUDENTS = 40;
let busy = false;

function el(id) { return document.getElementById(id); }
function showAlert(msg) { el('alert-text').textContent = msg; el('custom-alert').classList.remove('hidden'); }
function closeAlert() { el('custom-alert').classList.add('hidden'); }
function escapeHtml(v) { return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function dateKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function normalizeDateStr(v) { if (!v) return ''; const s = String(v).trim(); if (s.includes('T')) return s.substring(0, 10); if (s.length >= 10 && s.charAt(4) === '-') return s.substring(0, 10); const d = new Date(s); return !isNaN(d.getTime()) ? dateKey(d) : s; }
function formatDate(v) { if (!v) return '-'; const d = new Date(String(v).includes('T') ? v : String(v).substring(0, 10) + 'T12:00:00'); return !isNaN(d.getTime()) ? d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : v; }
function showLoading(txt = 'กำลังโหลด...') { el('loading-text').textContent = txt; el('loading-overlay').classList.remove('hidden'); }
function hideLoading() { el('loading-overlay').classList.add('hidden'); }
function setStatus(msg, success = true) { el('sync-status').className = 'p-2 rounded-xl text-[10px] font-bold mb-3 text-center border ' + (success ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-rose-50 text-rose-600 border-rose-100'); el('sync-status').textContent = msg; }

async function fetchJSON(url) {
  const res = await fetch(url, { method: 'GET', redirect: 'follow' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

async function execute(label, action) {
  if (busy) return false; busy = true; showLoading(label);
  try { await action(); return true; } catch (e) { showAlert(e.message || 'เกิดข้อผิดพลาด'); return false; } finally { busy = false; hideLoading(); }
}

function isAdmin() { return currentUser && ['admin', 'creator'].includes(String(currentUser.role).toLowerCase()); }
function updateAdminUI() { const adm = isAdmin(); el('btn-logs').classList.toggle('hidden', !adm); el('btn-options').classList.toggle('hidden', !adm); }

async function login() {
  const u = el('username').value.trim();
  if (!u) { showAlert('กรุณากรอกชื่อผู้ใช้งาน'); return; }
  await execute('กำลังตรวจสอบสิทธิ์...', async () => {
    const res = await fetchJSON(`${SCRIPT_URL}?action=checkLogin&username=${encodeURIComponent(u)}&t=${Date.now()}`);
    if (res && res.success && res.user) {
      currentUser = res.user;
      localStorage.setItem('homeworkLastUser', currentUser.username);
      sessionStorage.setItem('homeworkUser', JSON.stringify(currentUser));
      el('login-page').classList.add('hidden');
      el('main-page').classList.remove('hidden');
      el('user-display').textContent = currentUser.name;
      updateAdminUI(); switchTab('pending'); await loadAllData(false);
      logActivity('เข้าสู่ระบบ', `${currentUser.name} เข้าสู่ระบบสำเร็จ`);
    } else { throw new Error(res.error || 'ไม่พบบัญชี'); }
  });
}

function logout() {
  logActivity('ออกจากระบบ', `${currentUser ? currentUser.name : 'Unknown'} ออกจากระบบ`);
  sessionStorage.removeItem('homeworkUser'); localStorage.removeItem('homeworkCacheData'); location.reload();
}

async function loadAllData(showMsg = false) {
  const cached = localStorage.getItem('homeworkCacheData');
  if (cached) { try { const p = JSON.parse(cached); tasks = p.tasks || []; dailyEvents = p.events || {}; codes = p.options?.codes || []; subjects = p.options?.subjects || []; updateOptions(); renderTasks(); renderCalendar(); selectDate(selectedDate); } catch(e){} }
  const load = async () => {
    const res = await fetchJSON(`${SCRIPT_URL}?t=${Date.now()}`);
    if (res) {
      tasks = res.tasks || []; dailyEvents = res.events || {}; codes = res.options?.codes || []; subjects = res.options?.subjects || [];
      localStorage.setItem('homeworkCacheData', JSON.stringify(res));
      updateOptions(); renderTasks(); renderCalendar(); selectDate(selectedDate);
      setStatus('ซิงค์ข้อมูลสำเร็จ • ' + new Date().toLocaleTimeString('th-TH'));
      if (showMsg) showAlert('ซิงค์ข้อมูลสำเร็จ');
    }
  };
  if (!cached) await execute('กำลังซิงค์...', load); else load().catch(e => {});
}

function switchTab(tab) {
  currentTab = tab;
  ['pending', 'calendar', 'tracking'].forEach(name => {
    el('view-' + name).classList.toggle('hidden', name !== tab);
    const btn = el('tab-' + name);
    btn.className = 'py-2 rounded-xl text-xs font-extrabold transition ' + (name === tab ? (tab === 'pending' ? 'bg-pink-500 text-white shadow-sm' : tab === 'calendar' ? 'bg-sky-400 text-white shadow-sm' : 'bg-purple-600 text-white shadow-sm') : 'text-slate-500');
  });
  el('filter-container').classList.toggle('hidden', tab === 'calendar');
}

function renderTasks() {
  const pinned = el('pinned-list'), list = el('task-list'), tracking = el('tracking-list'), selector = el('student-task-select');
  pinned.innerHTML = ''; list.innerHTML = ''; tracking.innerHTML = ''; selector.innerHTML = '';
  
  const kw = (el('search-keyword').value || '').toLowerCase().trim();
  const subj = el('filter-subject').value;
  const mode = el('filter-date-mode').value;

  let filtered = tasks.filter(t => (!kw || (t.code && t.code.toLowerCase().includes(kw)) || (t.subject && t.subject.toLowerCase().includes(kw)) || (t.detail && t.detail.toLowerCase().includes(kw))) && (!subj || t.subject === subj));
  
  filtered.sort((a, b) => {
    if (mode === 'due-soon') return (a.dueDate ? new Date(a.dueDate).getTime() : 0) - (b.dueDate ? new Date(b.dueDate).getTime() : 0);
    if (mode === 'assign-new') return (b.assignDate ? new Date(b.assignDate).getTime() : 0) - (a.assignDate ? new Date(a.assignDate).getTime() : 0);
    return Number(b.id || 0) - Number(a.id || 0);
  });

  el('task-count').textContent = filtered.length + ' ITEMS';
  if(el('tracking-count')) el('tracking-count').textContent = filtered.length + ' ITEMS';

  filtered.forEach(t => {
    if (t.isPinned) pinned.appendChild(createTaskCard(t)); else list.appendChild(createTaskCard(t));
    tracking.appendChild(createTrackingCard(t));
    const opt = document.createElement('option'); opt.value = t.id; opt.textContent = t.subject + ' - ' + t.detail; selector.appendChild(opt);
  });

  if (!pinned.children.length) pinned.innerHTML = '<p class="text-[10px] text-amber-500 text-center py-1 font-bold">ไม่มีรายการปักหมุด</p>';
  if (!list.children.length) list.innerHTML = '<p class="text-xs text-slate-500 text-center py-5 font-bold">ไม่พบรายการการบ้าน</p>';
  if (!tracking.children.length) tracking.innerHTML = '<p class="text-xs text-slate-500 text-center py-5 font-bold">ไม่พบรายการงานค้าง</p>';
}

function getUnsubmitted(t) {
  const sub = new Set((t.submitted || []).map(String)), ext = new Set((t.extraUnsubmitted || []).map(String)), res = [];
  for (let i = 1; i <= TOTAL_STUDENTS; i++) if (!sub.has(String(i))) res.push(String(i));
  ext.forEach(n => { if (!sub.has(n) && !res.includes(n)) res.push(n); });
  return res;
}

function createTaskCard(t) {
  const div = document.createElement('div'); div.className = 'bg-white border border-slate-100 rounded-2xl p-3 shadow-sm space-y-2';
  const un = getUnsubmitted(t), tot = TOTAL_STUDENTS + (t.extraUnsubmitted || []).filter(n => Number(n) > TOTAL_STUDENTS).length, comp = Math.max(0, tot - un.length), pct = tot ? Math.round(comp / tot * 100) : 0;
  div.innerHTML = `
    <div class="flex justify-between items-start gap-2">
      <div><span class="text-[9px] bg-pink-50 text-pink-600 px-1.5 py-0.5 rounded font-extrabold border border-pink-100">${escapeHtml(t.code)}</span><h3 class="font-extrabold text-xs text-slate-800 mt-1">${escapeHtml(t.subject)}</h3><p class="text-[10px] text-slate-600 mt-0.5">${escapeHtml(t.detail)}</p><div class="flex gap-3 mt-1 text-[9px] font-bold text-slate-400"><span>สั่ง: ${formatDate(t.assignDate)}</span><span class="text-rose-500">ส่ง: ${formatDate(t.dueDate)}</span></div></div>
      <div class="flex gap-1"><button data-pin class="text-amber-500 p-1"><i class="fa-solid fa-thumbtack"></i></button><button data-del class="text-rose-500 p-1"><i class="fa-solid fa-trash"></i></button></div>
    </div>
    <div class="pt-1.5 border-t border-slate-100"><div class="flex justify-between items-center text-[9px] font-extrabold mb-1.5"><span class="text-emerald-600">ส่งแล้ว ${comp}/${tot} (${pct}%)</span><span class="text-rose-500">ยังไม่ส่ง (${un.length})</span></div><div class="flex flex-wrap gap-1" data-st></div></div>`;
  div.querySelector('[data-pin]').onclick = () => togglePin(t.id);
  div.querySelector('[data-del]').onclick = () => deleteTask(t.id);
  const st = div.querySelector('[data-st]');
  un.forEach(n => { const b = document.createElement('button'); b.className = 'bg-rose-50 text-rose-600 px-2 py-0.5 rounded text-[10px] font-bold border border-rose-100'; b.textContent = n; b.onclick = () => toggleStudent(t.id, n); st.appendChild(b); });
  return div;
}

function createTrackingCard(t) {
  const div = document.createElement('div'); div.className = 'bg-white border border-slate-100 rounded-2xl p-3 space-y-2 shadow-sm';
  const un = getUnsubmitted(t), tot = TOTAL_STUDENTS + (t.extraUnsubmitted || []).filter(n => Number(n) > TOTAL_STUDENTS).length, comp = Math.max(0, tot - un.length), pct = tot ? Math.round(comp / tot * 100) : 0;
  div.innerHTML = `
    <div class="flex justify-between items-start gap-2">
      <div><span class="text-[9px] bg-purple-50 text-purple-600 px-1.5 py-0.5 rounded font-extrabold border border-purple-100">${escapeHtml(t.code)}</span><h3 class="font-extrabold text-xs text-slate-800 mt-1">${escapeHtml(t.subject)}</h3><p class="text-[10px] text-slate-600 mt-0.5">${escapeHtml(t.detail)}</p><div class="flex gap-3 mt-1 text-[9px] font-bold text-slate-400"><span>สั่ง: ${formatDate(t.assignDate)}</span><span class="text-rose-500">ส่ง: ${formatDate(t.dueDate)}</span></div></div>
      <div class="flex gap-1"><button data-pin class="text-amber-500 p-1"><i class="fa-solid fa-thumbtack"></i></button><button data-del class="text-rose-500 p-1"><i class="fa-solid fa-trash"></i></button></div>
    </div>
    <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full rounded-full" style="width:${pct}%"></div></div>
    <div class="flex justify-between items-center text-[9px] font-extrabold"><span class="text-emerald-600">ส่งแล้ว ${comp}/${tot} (${pct}%)</span><span class="text-rose-500">ยังไม่ส่ง (${un.length})</span></div>
    <div class="flex flex-wrap gap-1 pt-1" data-st></div>`;
  div.querySelector('[data-pin]').onclick = () => togglePin(t.id);
  div.querySelector('[data-del]').onclick = () => deleteTask(t.id);
  const st = div.querySelector('[data-st]');
  un.forEach(n => { const b = document.createElement('button'); b.className = 'bg-rose-50 text-rose-600 px-2 py-0.5 rounded text-[10px] font-bold border border-rose-100'; b.textContent = n; b.onclick = () => toggleStudent(t.id, n); st.appendChild(b); });
  return div;
}

function toggleForm(id) { ['task-form', 'student-form', 'event-form'].forEach(n => { if (n !== id) el(n).classList.add('hidden'); }); el(id).classList.toggle('hidden'); }

async function sendSaveRequest(action, data = null) {
  await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, tasks: action === 'saveTasks' ? data : undefined, events: action === 'saveEvents' ? data : undefined }) });
  await new Promise(r => setTimeout(r, 1200));
}

async function addTask() {
  const t = { id: String(Date.now()), code: el('task-code').value.trim(), subject: el('task-subject').value.trim(), detail: el('task-detail').value.trim(), assignDate: el('task-assign-date').value, dueDate: el('task-due-date').value, isPinned: false, submitted: [], extraUnsubmitted: [] };
  if (!t.code || !t.subject || !t.detail || !t.dueDate) { showAlert('กรุณากรอกข้อมูลให้ครบ'); return; }
  if (tasks.some(x => x.code.toLowerCase() === t.code.toLowerCase() && x.detail.toLowerCase() === t.detail.toLowerCase())) { showAlert('แจ้งเตือน: มีการบันทึกงานซ้ำในระบบแล้ว!'); return; }
  const updated = [t, ...tasks];
  if (await execute('กำลังบันทึก...', async () => { await sendSaveRequest('saveTasks', updated); })) {
    tasks = updated;
    const c = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}'); c.tasks = tasks; localStorage.setItem('homeworkCacheData', JSON.stringify(c));
    ['task-code', 'task-subject', 'task-detail', 'task-assign-date', 'task-due-date'].forEach(id => el(id).value = '');
    el('task-form').classList.add('hidden'); renderTasks(); renderCalendar(); selectDate(selectedDate);
    setStatus('บันทึกการบ้านเรียบร้อย'); logActivity('เพิ่มการบ้าน', `${t.subject} - ${t.detail}`); showAlert('บันทึกการบ้านสำเร็จแล้ว');
  }
}

async function togglePin(id) {
  const t = tasks.find(x => String(x.id) === String(id));
  if (t) { t.isPinned = !t.isPinned; renderTasks(); const c = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}'); c.tasks = tasks; localStorage.setItem('homeworkCacheData', JSON.stringify(c)); sendSaveRequest('saveTasks', tasks); }
}

async function deleteTask(id) {
  if (!confirm('ต้องการลบการบ้านนี้ใช่หรือไม่?')) return;
  tasks = tasks.filter(x => String(x.id) !== String(id));
  renderTasks(); renderCalendar(); selectDate(selectedDate);
  const c = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}'); c.tasks = tasks; localStorage.setItem('homeworkCacheData', JSON.stringify(c));
  sendSaveRequest('saveTasks', tasks);
}

async function toggleStudent(tid, num) {
  const t = tasks.find(x => String(x.id) === String(tid));
  if (!t) return; if (!Array.isArray(t.submitted)) t.submitted = [];
  const idx = t.submitted.indexOf(String(num));
  if (idx === -1) t.submitted.push(String(num)); else t.submitted.splice(idx, 1);
  renderTasks(); selectDate(selectedDate);
  const c = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}'); c.tasks = tasks; localStorage.setItem('homeworkCacheData', JSON.stringify(c));
  sendSaveRequest('saveTasks', tasks);
}

async function addExtraStudent() {
  const tid = el('student-task-select').value, num = el('student-number').value.trim();
  if (!tid || !num) return; const t = tasks.find(x => String(x.id) === String(tid)); if (!t) return;
  if (!Array.isArray(t.extraUnsubmitted)) t.extraUnsubmitted = [];
  if (t.extraUnsubmitted.includes(num)) { showAlert('แจ้งเตือน: มีรายชื่อเลขที่นี้อยู่แล้ว!'); return; }
  t.extraUnsubmitted.push(num); renderTasks();
  const c = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}'); c.tasks = tasks; localStorage.setItem('homeworkCacheData', JSON.stringify(c));
  sendSaveRequest('saveTasks', tasks); showAlert('เพิ่มรายชื่อสำเร็จ'); el('student-number').value = ''; el('student-form').classList.add('hidden');
}

function renderCalendar() {
  const y = calendarDate.getFullYear(), m = calendarDate.getMonth();
  el('calendar-month-year').textContent = calendarDate.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
  const container = el('calendar-days'); container.innerHTML = '';
  const first = new Date(y, m, 1).getDay(), total = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < first; i++) container.appendChild(document.createElement('div'));
  for (let d = 1; d <= total; d++) {
    const key = dateKey(new Date(y, m, d)), btn = document.createElement('button');
    btn.className = 'h-12 rounded-xl transition flex flex-col items-center justify-start pt-1.5 p-0.5 ' + (key === selectedDate ? 'border-2 border-sky-400 bg-white text-sky-500 font-black' : 'bg-slate-50 text-slate-700 hover:bg-slate-100 border border-slate-100');
    btn.onclick = () => selectDate(key);
    btn.innerHTML = `<span class="text-xs font-extrabold leading-none mb-1">${d}</span>`;
    const hasT = tasks.some(t => normalizeDateStr(t.assignDate) === key || normalizeDateStr(t.dueDate) === key);
    const evs = dailyEvents[key] ? (Array.isArray(dailyEvents[key]) ? dailyEvents[key] : [dailyEvents[key]]) : [];
    if (hasT || evs.length) {
      const dots = document.createElement('div'); dots.className = 'flex gap-0.5 items-center justify-center';
      if (hasT) dots.innerHTML += '<span class="w-1 h-1 rounded-full bg-pink-500"></span>';
      if (evs.length) dots.innerHTML += '<span class="w-1 h-1 rounded-full bg-sky-400"></span>';
      btn.appendChild(dots);
    }
    container.appendChild(btn);
  }
}

function changeMonth(dir) { calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + dir, 1); renderCalendar(); }

function selectDate(key) {
  selectedDate = key; renderCalendar();
  el('selected-date-label').textContent = 'วันที่ ' + formatDate(key);
  const container = el('selected-date-tasks'); container.innerHTML = '';
  const matches = tasks.filter(t => normalizeDateStr(t.assignDate) === key || normalizeDateStr(t.dueDate) === key);
  el('selected-date-count').textContent = matches.length + ' รายการ';
  matches.forEach(t => container.appendChild(createTaskCard(t)));
  if (!matches.length) container.innerHTML = '<p class="text-[10px] text-slate-400 text-center py-1 font-bold">ไม่มีรายการในวันนี้</p>';

  const evList = el('event-list'); evList.innerHTML = '';
  const evs = dailyEvents[key] ? (Array.isArray(dailyEvents[key]) ? dailyEvents[key] : [dailyEvents[key]]) : [];
  evs.forEach((ev, idx) => {
    const d = document.createElement('div'); d.className = 'bg-sky-50 text-sky-800 rounded-lg p-1.5 text-[10px] border border-sky-100 font-bold flex justify-between items-center';
    d.innerHTML = `<span>${escapeHtml(ev)}</span><button class="text-rose-500"><i class="fa-solid fa-trash"></i></button>`;
    d.querySelector('button').onclick = () => deleteEvent(key, idx);
    evList.appendChild(d);
  });
  if (!evList.children.length) evList.innerHTML = '<p class="text-[10px] text-slate-400 font-semibold">ไม่มีกิจกรรมพิเศษ</p>';
}

async function addEvent() {
  const ev = el('event-input').value.trim(); if (!ev) return;
  if (!dailyEvents[selectedDate]) dailyEvents[selectedDate] = [];
  else if (!Array.isArray(dailyEvents[selectedDate])) dailyEvents[selectedDate] = [dailyEvents[selectedDate]];
  if (dailyEvents[selectedDate].includes(ev)) { showAlert('แจ้งเตือน: มีกิจกรรมนี้แล้ว!'); return; }
  dailyEvents[selectedDate].push(ev); selectDate(selectedDate); el('event-input').value = ''; el('event-form').classList.add('hidden');
  const c = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}'); c.events = dailyEvents; localStorage.setItem('homeworkCacheData', JSON.stringify(c));
  sendSaveRequest('saveEvents', dailyEvents); showAlert('เพิ่มกิจกรรมสำเร็จ');
}

async function deleteEvent(key, idx) {
  if (!confirm('ลบกิจกรรมนี้ใช่หรือไม่?')) return;
  const evs = Array.isArray(dailyEvents[key]) ? dailyEvents[key] : [dailyEvents[key]];
  evs.splice(idx, 1); if (!evs.length) delete dailyEvents[key]; else dailyEvents[key] = evs;
  selectDate(selectedDate);
  const c = JSON.parse(localStorage.getItem('homeworkCacheData') || '{}'); c.events = dailyEvents; localStorage.setItem('homeworkCacheData', JSON.stringify(c));
  sendSaveRequest('saveEvents', dailyEvents);
}

function updateOptions() {
  el('code-options').innerHTML = ''; el('subject-options').innerHTML = '';
  const fSubj = el('filter-subject'), cur = fSubj.value; fSubj.innerHTML = '<option value="">ทุกวิชา</option>';
  codes.forEach(c => { const o = document.createElement('option'); o.value = c; el('code-options').appendChild(o); });
  subjects.forEach(s => { const o = document.createElement('option'); o.value = s; el('subject-options').appendChild(o); const fo = document.createElement('option'); fo.value = s; fo.textContent = s; fSubj.appendChild(fo); });
  fSubj.value = cur;
}

function openModal(title, content) { el('modal-title').textContent = title; el('modal-content').innerHTML = content; el('modal').classList.remove('hidden'); }
function closeModal() { el('modal').classList.add('hidden'); }

function openOptions() {
  if (!isAdmin()) { showAlert('ไม่มีสิทธิ์เข้าถึง'); return; }
  openModal('รายการรหัสและชื่อวิชา', `<div class="space-y-2 text-xs"><div class="bg-slate-50 p-2 rounded-xl"><b class="text-pink-600">รหัส:</b> ${codes.join(', ')}</div><div class="bg-slate-50 p-2 rounded-xl"><b class="text-sky-600">วิชา:</b> ${subjects.join(', ')}</div><button onclick="loadAllData(true); closeModal();" class="w-full bg-sky-50 text-sky-600 py-1.5 rounded-lg font-bold mt-2">รีเฟรช</button></div>`);
}

async function openLogs() {
  if (!isAdmin()) { showAlert('ไม่มีสิทธิ์เข้าถึง'); return; }
  openModal('ประวัติการใช้งาน', '<p class="text-xs text-center py-2 text-slate-500">กำลังโหลด...</p>');
  try {
    const logs = await fetchJSON(`${SCRIPT_URL}?action=getLogs&all=false&t=${Date.now()}`);
    const c = el('modal-content'); c.innerHTML = '';
    if (logs.length) {
      const list = document.createElement('div'); list.className = 'space-y-1.5 max-h-60 overflow-y-auto';
      logs.reverse().forEach(l => {
        const d = document.createElement('div'); d.className = 'bg-slate-50 p-2 rounded-xl text-[10px]';
        d.innerHTML = `<div class="flex justify-between font-bold text-pink-600"><span>${escapeHtml(l.actionText)}</span><span class="text-slate-400">${l.timestamp ? new Date(l.timestamp).toLocaleTimeString('th-TH') : ''}</span></div><p class="text-slate-700">${escapeHtml(l.details)}</p>`;
        list.appendChild(d);
      });
      c.appendChild(list);
    } else { c.innerHTML = '<p class="text-xs text-center text-slate-500">ไม่มีประวัติ</p>'; }
  } catch(e) { el('modal-content').textContent = e.message; }
}

function logActivity(actionText, details) {
  fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'saveLog', username: currentUser ? currentUser.username : 'Unknown', actionText, details }) }).catch(e => {});
}

document.addEventListener('DOMContentLoaded', async () => {
  const last = localStorage.getItem('homeworkLastUser'); if (last) el('username').value = last;
  const saved = sessionStorage.getItem('homeworkUser');
  if (saved) {
    try { currentUser = JSON.parse(saved); el('login-page').classList.add('hidden'); el('main-page').classList.remove('hidden'); el('user-display').textContent = currentUser.name; updateAdminUI(); switchTab('pending'); await loadAllData(false); } catch(e) { sessionStorage.removeItem('homeworkUser'); }
  }
});
</script>
</body>
