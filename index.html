<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.113-Room : ระบบจัดการการบ้านและปฏิทิน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">📚 M.113-Room</h1>
            <div id="user-info" class="text-sm bg-indigo-700 px-3 py-1 rounded-full">กำลังโหลด...</div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- ฝั่งซ้าย: ฟอร์มเพิ่มการบ้าน (เฉพาะแอดมิน/ผู้มีสิทธิ์) และตัวกรอง -->
        <div class="md:col-span-1 space-y-6">
            <div id="admin-card" class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 hidden">
                <h2 class="font-bold text-lg mb-4 text-indigo-600">➕ เพิ่มการบ้านใหม่</h2>
                <form id="task-form" onsubmit="handleAddTask(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสวิชา / ชื่อวิชา</label>
                        <input type="text" id="task-subject" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="เช่น TH101 ภาษาไทย">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">รายละเอียดงาน</label>
                        <textarea id="task-desc" required rows="2" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="รายละเอียดการบ้าน..."></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">กำหนดส่ง</label>
                        <input type="date" id="task-due" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">แนบรูปภาพประกอบ (ถ้ามี)</label>
                        <input type="file" id="task-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition">บันทึกการบ้าน</button>
                </form>
            </div>

            <!-- ส่วนปฏิทินย่อ -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-md mb-2 text-slate-700">📅 ปฏิทินงาน</h3>
                <div id="calendar-widget" class="text-sm text-slate-500">กำลังโหลดปฏิทิน...</div>
            </div>
        </div>

        <!-- ฝั่งขวา: รายการการบ้าน -->
        <div class="md:col-span-2 space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                <h2 class="font-bold text-lg text-slate-700">📋 รายการการบ้านทั้งหมด</h2>
                <input type="text" id="search-input" oninput="filterTasks()" placeholder="🔍 ค้นหาการบ้าน..." class="px-3 py-1.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div id="tasks-container" class="space-y-3">
                <!-- รายการการบ้านจะถูกเรนเดอร์มาแสดงที่นี่ -->
                <div class="text-center py-10 text-slate-400">กำลังโหลดข้อมูล...</div>
            </div>
        </div>
    </main>

    <!-- Modal แจ้งเตือนสำเร็จแบบ Embedded Popup ตามความต้องการ -->
    <div id="modal-popup" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-lg max-w-sm w-full mx-4 text-center space-y-3">
            <div id="modal-icon" class="text-4xl">✅</div>
            <h3 id="modal-title" class="font-bold text-lg">สำเร็จ</h3>
            <p id="modal-message" class="text-sm text-slate-600">ดำเนินการเรียบร้อยแล้ว</p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">ตกลง</button>
        </div>
    </div>

    <!-- Script สำหรับการทำงานหน้าเว็บ -->
    <script>
        // แทนที่ด้วย URL ของ Web App หลังจากที่คุณ Deploy สำเร็จ
        const API_URL = "ใส่_Web_App_URL_ของคุณตรงนี้"; 
        let appData = { tasks: [], events: {}, user: { username: "member", role: "admin" } };

        // โหลดข้อมูลเริ่มต้นเมื่อเปิดเว็บ
        async function initApp() {
            try {
                // จำลองการล็อกอินหรือดึงข้อมูล
                const res = await fetch(`${API_URL}?action=checkLogin&username=admin`);
                const result = await res.json();
                if(result.success) {
                    appData.user = result.user;
                    document.getElementById('user-info').innerText = `${appData.user.name} (${appData.user.role})`;
                    if(appData.user.role === 'admin') {
                        document.getElementById('admin-card').classList.remove('hidden');
                    }
                }
                loadTasks();
            } catch(e) {
                console.error(e);
                // ข้อมูลตัวอย่างกรณีทดสอบหน้าเว็บเบื้องต้น
                renderTasks([
                    { id: 1, subject: "TH101 ภาษาไทย", desc: "คัดลายมือบทที่ 3", dueDate: "2026-11-10", imageUrl: "" }
                ]);
            }
        }

        async function loadTasks() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                appData.tasks = data.tasks || [];
                renderTasks(appData.tasks);
            } catch(e) {
                console.log("Using local render fallback");
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasks-container');
            if(tasks.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400 border">ไม่มีรายการการบ้านในขณะนี้</div>`;
                return;
            }
            container.innerHTML = tasks.map(t => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div class="space-y-1">
                        <span class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1 rounded-md">${t.subject}</span>
                        <h4 class="font-bold text-slate-800">${t.desc}</h4>
                        <p class="text-xs text-slate-500">📅 กำหนดส่ง: ${t.dueDate}</p>
                    </div>
                    ${t.imageUrl ? `<a href="${t.imageUrl}" target="_blank"><img src="${t.imageUrl}" class="w-16 h-16 object-cover rounded-lg border hover:opacity-80 transition cursor-pointer" title="ดูรูปภาพ"></a>` : ''}
                </div>
            `).join('');
        }

        async function handleAddTask(e) {
            e.preventDefault();
            const subject = document.getElementById('task-subject').value;
            const desc = document.getElementById('task-desc').value;
            const dueDate = document.getElementById('task-due').value;
            const fileInput = document.getElementById('task-file');

            let imageObj = null;
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                imageObj = await toBase64(file);
            }

            const newTask = { id: Date.now(), subject, desc, dueDate, imageObj };
            appData.tasks.push(newTask);

            // ส่งข้อมูลไปบันทึกที่ Backend
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'saveTasks', tasks: appData.tasks })
                });
                showModal("สำเร็จ", "บันทึกข้อมูลและอัปโหลดรูปภาพเรียบร้อยแล้ว");
                renderTasks(appData.tasks);
                document.getElementById('task-form').reset();
            } catch(err) {
                showModal("แจ้งเตือน", "เกิดข้อผิดพลาดในการบันทึกข้อมูล", "❌");
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({ name: file.name, type: file.type, data: reader.result });
                reader.onerror = error => reject(error);
            });
        }

        function filterTasks() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const filtered = appData.tasks.filter(t => t.subject.toLowerCase().includes(keyword) || t.desc.toLowerCase().includes(keyword));
            renderTasks(filtered);
        }

        function showModal(title, message, icon="✅") {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-popup').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-popup').classList.add('hidden');
        }

        initApp();
    </script>
</body>
</html>
