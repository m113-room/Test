        <div id="task-form" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-4 mb-4 space-y-3 shadow-sm">
          <h3 class="text-xs font-bold text-pink-600 mb-1">เพิ่มรายการการบ้าน</h3>
          
          <div class="grid grid-cols-2 gap-2">
            <!-- เปลี่ยนรหัสวิชาเป็น Dropdown -->
            <div>
              <label class="block text-[10px] font-bold text-slate-500 mb-1">รหัสวิชา:</label>
              <select id="task-code" onchange="autoFillSubject('code')" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-white font-semibold text-slate-700">
                <option value="">เลือกรหัสวิชา</option>
              </select>
            </div>
            <!-- เปลี่ยนชื่อวิชาเป็น Dropdown -->
            <div>
              <label class="block text-[10px] font-bold text-slate-500 mb-1">ชื่อวิชา:</label>
              <select id="task-subject" onchange="autoFillSubject('subject')" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-white font-semibold text-slate-700">
                <option value="">เลือกชื่อวิชา</option>
              </select>
            </div>
          </div>

          <input id="task-detail" placeholder="รายละเอียดการบ้าน" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs bg-white">
          
          <div class="grid grid-cols-2 gap-2">
            <div class="flex items-center bg-white border border-slate-200 rounded-xl px-2.5 py-1.5">
              <span class="text-[10px] font-bold text-slate-500 mr-2 leading-tight">วัน<br>สั่ง:</span>
              <input id="task-assign-date" type="date" class="w-full text-xs bg-transparent border-0 p-0">
            </div>
            <div class="flex items-center bg-white border border-slate-200 rounded-xl px-2.5 py-1.5">
              <span class="text-[10px] font-bold text-slate-500 mr-2 leading-tight">วัน<br>ส่ง:</span>
              <input id="task-due-date" type="date" class="w-full text-xs bg-transparent border-0 p-0">
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-bold text-slate-500 mb-1">แนบรูปภาพประกอบ (ถ้ามี):</label>
            <input id="task-image" type="file" accept="image/*" class="w-full text-xs p-1.5 border border-slate-200 rounded-xl bg-white">
          </div>

          <button onclick="addTask()" class="w-full bg-purple-600 text-white py-3 rounded-2xl font-extrabold text-xs shadow-sm hover:opacity-95 transition mt-2">
            บันทึกข้อมูลการบ้าน
          </button>
        </div>
