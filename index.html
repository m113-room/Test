<section id="view-calendar" class="hidden">
  <button onclick="toggleForm('event-form')" class="w-full bg-[#38bdf8] text-white font-extrabold py-3 rounded-2xl text-xs mb-4 shadow-sm hover:opacity-95 transition">
    + เพิ่มกิจกรรม
  </button>

  <div id="event-form" class="hidden bg-sky-50 border border-sky-100 rounded-2xl p-3.5 mb-4 space-y-2.5">
    <input id="event-input" class="w-full border rounded-xl p-2.5 text-xs bg-white" placeholder="ชื่อกิจกรรม">
    <button onclick="addEvent()" class="w-full bg-sky-500 text-white rounded-xl py-2 text-xs font-bold">บันทึกกิจกรรม</button>
  </div>

  <div class="flex justify-between items-center mb-3">
    <h2 id="calendar-month-year" class="text-xs font-extrabold text-slate-700"></h2>
    <div class="flex gap-1 text-[10px] font-bold">
      <button onclick="changeMonth(-1)" class="bg-slate-100 px-2.5 py-1 rounded-lg text-slate-600">PREV</button>
      <button onclick="changeMonth(1)" class="bg-slate-100 px-2.5 py-1 rounded-lg text-slate-600">NEXT</button>
    </div>
  </div>

  <div class="bg-white rounded-2xl p-3.5 border border-slate-100 shadow-sm mb-4">
    <div class="grid grid-cols-7 text-center text-[10px] font-extrabold mb-2">
      <span style="color: #ef4444;">SUN</span>
      <span style="color: #eab308;">MON</span>
      <span style="color: #ec4899;">TUE</span>
      <span style="color: #22c55e;">WED</span>
      <span style="color: #f97316;">THU</span>
      <span style="color: #3b82f6;">FRI</span>
      <span style="color: #a855f7;">SAT</span>
    </div>
    <div id="calendar-days" class="grid grid-cols-7 gap-1.5"></div>
  </div>

  <div class="bg-slate-50/60 border border-slate-100 rounded-2xl p-3.5">
    <div class="flex justify-between items-center mb-2">
      <h3 id="selected-date-label" class="font-extrabold text-xs text-slate-700"></h3>
      <span id="selected-date-count" class="text-[10px] font-extrabold text-slate-600 bg-slate-200/60 px-2 py-0.5 rounded-full">0 รายการ</span>
    </div>

    <div class="mb-3">
      <h4 class="text-[11px] font-extrabold text-sky-500 mb-1">★ กิจกรรมในวันนี้</h4>
      <div id="event-list" class="space-y-1"></div>
    </div>

    <div id="selected-date-tasks" class="space-y-2"></div>
  </div>
</section>
