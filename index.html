<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework M.113</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body { 
      font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
      margin: 0;
    }

    .hidden { display: none !important; }

    .app-layout {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
    }

    .app-card {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .brand-line {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      text-align: center;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.94); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-pop { animation: pop .2s ease-out; }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    input, select { outline: none; }
    input:focus, select:focus { border-color: #ff75bc; }

    @media (max-height: 650px) {
      .app-layout { align-items: flex-start; }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-[#FFC2E2] via-purple-200 to-[#B6F0FF]">

  <div id="loading-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] hidden flex items-center justify-center">
    <div class="bg-white rounded-3xl p-7 shadow-2xl text-center">
      <div class="w-10 h-10 border-4 border-pink-400 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
      <p id="loading-text" class="text-xs font-bold text-slate-700">กำลังโหลด...</p>
    </div>
  </div>

  <div class="app-layout">

    <!-- หน้าเข้าสู่ระบบ -->
    <div id="login-page" class="app-card max-w-sm bg-white/85 backdrop-blur-xl rounded-3xl p-8 shadow-xl border border-white">
      <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto bg-gradient-to-br from-pink-400 to-sky-400 rounded-2xl flex items-center justify-center text-white text-3xl mb-4">
          <i class="fa-solid fa-book-open-reader"></i>
        </div>

        <div class="brand-line">
          <h1 class="text-2xl font-extrabold text-slate-800">Homework M.113</h1>
        </div>
      </div>

      <label class="text-xs font-bold text-slate-600">ชื่อผู้ใช้งาน</label>

      <input id="username" type="text" placeholder="Username"
        class="w-full mt-2 p-3 rounded-2xl bg-slate-50 border text-sm"
        onkeydown="if(event.key==='Enter')login()">

      <button id="login-btn" onclick="login()"
        class="w-full mt-5 py-3 bg-gradient-to-r from-pink-400 to-rose-400 text-white rounded-2xl font-bold">
        เข้าสู่ระบบ
      </button>
    </div>

    <!-- หน้าโฮม -->
    <main id="main-page" class="app-card hidden max-w-2xl bg-white/85 backdrop-blur-xl rounded-3xl shadow-2xl p-5 sm:p-7 border border-white">

      <header class="border-b pb-4 mb-5">
        <div class="brand-line">
          <h1 class="font-extrabold text-pink-500 text-xl">
            HOMEWORK <span class="text-slate-800">M113</span>
          </h1>
        </div>

        <p id="user-display" class="text-xs text-slate-500 mt-2 text-center"></p>

        <div class="flex justify-center gap-2 mt-3">
          <button onclick="loadAllData(true)" class="bg-sky-100 text-sky-700 px-3 py-2 rounded-xl text-xs">
            <i class="fa-solid fa-rotate"></i>
          </button>

          <button onclick="logout()" class="bg-rose-100 text-rose-600 px-3 py-2 rounded-xl text-xs font-bold">
            LOGOUT
          </button>
        </div>
      </header>

      <div id="sync-status" class="bg-slate-100 text-slate-600 p-3 rounded-2xl text-xs font-bold mb-4 text-center">
        <i class="fa-solid fa-circle-info"></i> พร้อมใช้งาน
      </div>

      <nav class="grid grid-cols-3 gap-2 bg-slate-100 rounded-2xl p-1 mb-5">
        <button id="tab-pending" onclick="switchTab('pending')" class="py-3 bg-pink-400 text-white rounded-xl text-xs font-bold">ภาพรวม</button>
        <button id="tab-calendar" onclick="switchTab('calendar')" class="py-3 text-slate-600 rounded-xl text-xs font-bold">ปฏิทิน</button>
        <button id="tab-tracking" onclick="switchTab('tracking')" class="py-3 text-slate-600 rounded-xl text-xs font-bold">งานค้าง</button>
      </nav>

      <section id="view-pending">
        <h2 class="text-sm font-extrabold text-pink-500 mb-3">
          <i class="fa-solid fa-thumbtack"></i> งานปักหมุด
        </h2>

        <div id="pinned-list" class="space-y-3 mb-5"></div>

        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-extrabold text-slate-800">รายการการบ้าน</h2>
          <span id="task-count" class="text-xs bg-slate-100 rounded-full px-3 py-1">0 รายการ</span>
        </div>

        <div id="task-list" class="space-y-3"></div>
      </section>

      <section id="view-calendar" class="hidden">
        <div class="flex justify-between items-center mb-4">
          <button onclick="changeMonth(-1)" class="bg-white border rounded-xl px-3 py-2 text-xs">PREV</button>
          <h2 id="calendar-month-year" class="text-sm font-bold"></h2>
          <button onclick="changeMonth(1)" class="bg-white border rounded-xl px-3 py-2 text-xs">NEXT</button>
        </div>

        <div class="bg-white rounded-2xl p-3 border">
          <div class="grid grid-cols-7 text-center text-xs font-bold mb-2">
            <span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span>
          </div>
          <div id="calendar-days" class="grid grid-cols-7 gap-1"></div>
        </div>

        <div class="mt-4 bg-sky-50 rounded-2xl p-4">
          <h3 id="selected-date-label" class="font-bold text-xs mb-3"></h3>
          <div id="selected-date-tasks" class="space-y-2"></div>
        </div>

        <div class="mt-4 bg-white rounded-2xl p-4 border">
          <h3 class="text-xs font-bold mb-3">กิจกรรม</h3>
          <div id="event-list" class="space-y-2 mb-3"></div>

          <input id="event-input" class="w-full border rounded-xl p-3 text-xs" placeholder="ชื่อกิจกรรม">

          <button onclick="addEvent()" class="w-full bg-sky-400 rounded-xl py-3 text-xs font-bold mt-2">
            เพิ่มกิจกรรม
          </button>
        </div>
      </section>

      <section id="view-tracking" class="hidden">

        <div class="grid grid-cols-2 gap-2 mb-4">
          <button onclick="toggleForm('task-form')" class="bg-purple-600 text-white py-3 rounded-xl text-xs font-bold">
            <i class="fa-solid fa-plus"></i> เพิ่มการบ้าน
          </button>

          <button onclick="toggleForm('student-form')" class="bg-indigo-600 text-white py-3 rounded-xl text-xs font-bold">
            <i class="fa-solid fa-user-plus"></i> เพิ่มคนค้าง
          </button>
        </div>

        <div id="task-form" class="hidden bg-slate-50 rounded-2xl p-4 mb-4 space-y-3">
          <h3 class="text-xs font-bold">เพิ่มรายการการบ้าน</h3>

          <input id="task-code" list="code-options" placeholder="รหัสวิชา" class="w-full p-3 border rounded-xl text-xs">
          <datalist id="code-options"></datalist>

          <input id="task-subject" list="subject-options" placeholder="ชื่อวิชา" class="w-full p-3 border rounded-xl text-xs">
          <datalist id="subject-options"></datalist>

          <input id="task-detail" placeholder="รายละเอียดการบ้าน" class="w-full p-3 border rounded-xl text-xs">

          <label class="block text-xs">วันสั่ง</label>
          <input id="task-assign-date" type="date" class="w-full p-3 border rounded-xl text-xs">

          <label class="block text-xs">วันส่ง</label>
          <input id="task-due-date" type="date" class="w-full p-3 border rounded-xl text-xs">

          <button id="save-task-btn" onclick="addTask()" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold text-xs">
            บันทึกการบ้าน
          </button>
        </div>

        <div id="student-form" class="hidden bg-slate-50 rounded-2xl p-4 mb-4 space-y-3">
          <h3 class="text-xs font-bold">เพิ่มเลขที่คนค้างงาน</h3>

          <select id="student-task-select" class="w-full p-3 border rounded-xl text-xs"></select>

          <input id="student-number" type="number" min="1" placeholder="เลขที่นักเรียน" class="w-full p-3 border rounded-xl text-xs">

          <button onclick="addExtraStudent()" class="w-full bg-indigo-600 text-white py-3 rounded-xl text-xs font-bold">
            บันทึก
          </button>
        </div>

        <div id="tracking-list" class="space-y-3"></div>
      </section>

      <div class="mt-6 border-t pt-4 grid grid-cols-2 gap-2">
        <button onclick="openOptions()" class="bg-sky-100 text-sky-700 rounded-xl py-3 text-xs font-bold">
          <i class="fa-solid fa-list-check"></i> จัดการวิชา
        </button>

        <button onclick="openLogs()" class="bg-purple-100 text-purple-700 rounded-xl py-3 text-xs font-bold">
          <i class="fa-solid fa-clock-rotate-left"></i> ประวัติ
        </button>
      </div>

    </main>
  </div>

  <div id="modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 w-full max-w-lg max-h-[85vh] overflow-y-auto animate-pop">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modal-title" class="font-extrabold text-sm"></h3>
        <button onclick="closeModal()" class="text-slate-500 font-bold">✕</button>
      </div>
      <div id="modal-content"></div>
    </div>
  </div>

<script>
'use strict';

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwe3KvdPOBpzlJLdGQLfFm2u1pkTKkT5idgIG79IVg944QI69imwWY52MKs2nu5aZbvDw/exec';

let currentUser = null;
let tasks = [];
let dailyEvents = {};
let codes = [];
let subjects = [];
let currentTab = 'pending';
let calendarDate = new Date();
let selectedDate = dateKey(new Date());

const TOTAL_STUDENTS = 40;
const IDLE_TIMEOUT = 7 * 60 * 1000;

let lastActivity = Date.now();
let busy = false;

function el(id) {
  return document.getElementById(id);
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function dateKey(date) {
  return date.getFullYear() + '-' +
    String(date.getMonth() + 1).padStart(2, '0') + '-' +
    String(date.getDate()).padStart(2, '0');
}

function formatDate(value) {
  if (!value) return '-';
  const d = new Date(String(value).substring(0, 10) + 'T12:00:00');
  if (isNaN(d.getTime())) return String(value);
  return d.toLocaleDateString('th-TH', {
    day: 'numeric',
    month: 'short',
    year: 'numeric'
  });
}

function showLoading(text = 'กำลังโหลด...') {
  el('loading-text').textContent = text;
  el('loading-overlay').classList.remove('hidden');
}

function hideLoading() {
  el('loading-overlay').classList.add('hidden');
}

function setStatus(message, success = true) {
  const box = el('sync-status');
  box.textContent = message;
  box.className = 'p-3 rounded-2xl text-xs font-bold mb-4 text-center ' +
    (success
      ? 'bg-emerald-100 text-emerald-700'
      : 'bg-rose-100 text-rose-700');
}

async function fetchJSON(url) {
  const res = await fetch(url, { 
    method: 'GET',
    redirect: 'follow'
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

async function execute(label, action) {
  if (busy) return false;
  busy = true;
  showLoading(label);

  try {
    await action();
    return true;
  } catch (error) {
    console.error(error);
    setStatus('ผิดพลาด: ' + error.message, false);
    alert('เกิดข้อผิดพลาด:\n' + error.message);
    return false;
  } finally {
    busy = false;
    hideLoading();
  }
}

function isAdmin() {
  return currentUser &&
    ['admin', 'creator'].includes(currentUser.role);
}

function requireAdmin() {
  if (!isAdmin()) {
    alert('เฉพาะ Admin หรือ Creator เท่านั้น');
    return false;
  }
  return true;
}

async function login() {
  const username = el('username').value.trim().toLowerCase();

  if (!username) {
    alert('กรุณากรอกชื่อผู้ใช้งาน');
    return;
  }

  await execute('กำลังเข้าสู่ระบบ...', async () => {
    const users = await fetchJSON(`${SCRIPT_URL}?action=getUsers&t=${Date.now()}`);
    const user = Array.isArray(users) ? users.find(u => String(u.username || u.Username || '').toLowerCase() === username) : null;

    if (!user) {
      throw new Error(`ไม่พบผู้ใช้งาน "${username}" ในระบบ`);
    }

    currentUser = {
      username: username,
      role: String(user.role || user.Role || 'member').toLowerCase(),
      name: String(user.name || user.Name || username)
    };

    sessionStorage.setItem('homeworkUser', JSON.stringify(currentUser));

    el('login-page').classList.add('hidden');
    el('main-page').classList.remove('hidden');

    el('user-display').textContent =
      currentUser.name + ' • ' + currentUser.role.toUpperCase();

    await loadAllData(false);
    logActivity('เข้าสู่ระบบ', `ผู้ใช้งาน ${currentUser.name} เข้าสู่ระบบ`);
  });
}

function logout() {
  currentUser = null;
  sessionStorage.removeItem('homeworkUser');
  location.reload();
}

async function loadAllData(showMessage = false) {
  const load = async () => {
    const [tasksRes, eventsRes, optionsRes] = await Promise.allSettled([
      fetchJSON(`${SCRIPT_URL}?t=${Date.now()}`),
      fetchJSON(`${SCRIPT_URL}?action=getEvents&t=${Date.now()}`),
      fetchJSON(`${SCRIPT_URL}?action=getOptions&t=${Date.now()}`)
    ]);

    tasks = (tasksRes.status === 'fulfilled' && Array.isArray(tasksRes.value)) ? tasksRes.value : [];
    dailyEvents = (eventsRes.status === 'fulfilled' && eventsRes.value) ? eventsRes.value : {};
    
    if (optionsRes.status === 'fulfilled' && optionsRes.value) {
      codes = optionsRes.value.codes || [];
      subjects = optionsRes.value.subjects || [];
    }

    updateOptions();
    renderTasks();
    renderCalendar();
    selectDate(selectedDate);

    setStatus('ซิงค์ข้อมูลสำเร็จ • ' +
      new Date().toLocaleTimeString('th-TH'));

    if (showMessage) {
      alert('ซิงค์ข้อมูลสำเร็จ');
    }
  };

  if (busy) {
    await load();
  } else {
    await execute('กำลังซิงค์ข้อมูล...', load);
  }
}

function switchTab(tab) {
  currentTab = tab;

  ['pending', 'calendar', 'tracking'].forEach(name => {
    el('view-' + name).classList.toggle('hidden', name !== tab);

    el('tab-' + name).className =
      'py-3 rounded-xl text-xs font-bold ' +
      (name === tab
        ? 'bg-pink-400 text-white'
        : 'text-slate-600');
  });
}

function renderTasks() {
  const pinned = el('pinned-list');
  const list = el('task-list');
  const tracking = el('tracking-list');
  const selector = el('student-task-select');

  pinned.innerHTML = '';
  list.innerHTML = '';
  tracking.innerHTML = '';
  selector.innerHTML = '';

  el('task-count').textContent = tasks.length + ' รายการ';

  tasks.forEach(task => {
    if (task.isPinned) {
      pinned.appendChild(createTaskCard(task));
    } else {
      list.appendChild(createTaskCard(task));
    }

    tracking.appendChild(createTrackingCard(task));

    const option = document.createElement('option');
    option.value = task.id;
    option.textContent = task.subject + ' - ' + task.detail;
    selector.appendChild(option);
  });

  if (!pinned.children.length) {
    pinned.innerHTML =
      '<p class="text-xs text-slate-400">ไม่มีงานปักหมุด</p>';
  }

  if (!list.children.length) {
    list.innerHTML =
      '<p class="text-xs text-slate-400">ไม่มีรายการการบ้าน</p>';
  }

  if (!tracking.children.length) {
    tracking.innerHTML =
      '<p class="text-xs text-slate-400">ไม่มีรายการ</p>';
  }
}

function createTaskCard(task) {
  const div = document.createElement('div');
  div.className = 'bg-white border rounded-2xl p-4 shadow-sm';

  div.innerHTML = `
    <div class="flex justify-between gap-3">
      <div class="min-w-0">
        <span class="text-[10px] bg-pink-100 text-pink-700 px-2 py-1 rounded-lg font-bold">
          ${escapeHtml(task.code)}
        </span>
        <h3 class="font-extrabold text-sm mt-2">${escapeHtml(task.subject)}</h3>
        <p class="text-xs text-slate-600 mt-1">${escapeHtml(task.detail)}</p>
        <p class="text-xs text-rose-500 mt-2">
          ส่ง: ${formatDate(task.dueDate)}
        </p>
      </div>

      <div class="flex gap-2 shrink-0">
        <button data-action="pin" class="text-amber-500">
          <i class="fa-solid fa-thumbtack"></i>
        </button>

        ${isAdmin() ? `
          <button data-action="delete" class="text-rose-500">
            <i class="fa-solid fa-trash"></i>
          </button>` : ''}
      </div>
    </div>
  `;

  div.querySelector('[data-action="pin"]').onclick =
    () => togglePin(task.id);

  const deleteButton = div.querySelector('[data-action="delete"]');

  if (deleteButton) {
    deleteButton.onclick = () => deleteTask(task.id);
  }

  return div;
}

function getUnsubmitted(task) {
  const submitted = new Set((task.submitted || []).map(String));
  const extra = new Set((task.extraUnsubmitted || []).map(String));
  const result = [];

  for (let i = 1; i <= TOTAL_STUDENTS; i++) {
    if (!submitted.has(String(i))) {
      result.push(String(i));
    }
  }

  extra.forEach(number => {
    if (!submitted.has(number) && !result.includes(number)) {
      result.push(number);
    }
  });

  return result;
}

function createTrackingCard(task) {
  const div = document.createElement('div');
  div.className = 'bg-white rounded-2xl border p-4 space-y-3';

  const unsubmitted = getUnsubmitted(task);

  const total = TOTAL_STUDENTS +
    (task.extraUnsubmitted || []).filter(
      n => Number(n) > TOTAL_STUDENTS
    ).length;

  const completed = Math.max(0, total - unsubmitted.length);
  const percent = total ? Math.round(completed / total * 100) : 0;

  div.innerHTML = `
    <div>
      <h3 class="font-extrabold text-sm">${escapeHtml(task.subject)}</h3>
      <p class="text-xs text-slate-600 mt-1">${escapeHtml(task.detail)}</p>
      <p class="text-xs text-rose-500 mt-2">กำหนดส่ง: ${formatDate(task.dueDate)}</p>
    </div>

    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
      <div class="bg-emerald-500 h-full rounded-full" style="width:${percent}%"></div>
    </div>

    <p class="text-xs font-bold text-emerald-600">
      ส่งแล้ว ${completed}/${total} (${percent}%)
    </p>

    <p class="text-xs font-bold">ยังไม่ส่ง (${unsubmitted.length})</p>
    <div class="flex flex-wrap gap-1" data-students></div>
  `;

  const students = div.querySelector('[data-students]');

  unsubmitted.forEach(number => {
    const button = document.createElement('button');

    button.className =
      'bg-rose-50 text-rose-600 px-2 py-1 rounded-lg text-xs border';

    button.textContent = number;
    button.title = 'เปลี่ยนสถานะเป็นส่งแล้ว';
    button.disabled = !isAdmin();
    button.onclick = () => toggleStudent(task.id, number);

    students.appendChild(button);
  });

  return div;
}

function toggleForm(id) {
  if (!requireAdmin()) return;

  ['task-form', 'student-form'].forEach(name => {
    if (name !== id) el(name).classList.add('hidden');
  });

  el(id).classList.toggle('hidden');
}

async function addTask() {
  if (!requireAdmin()) return;

  const task = {
    id: String(Date.now()),
    code: el('task-code').value.trim(),
    subject: el('task-subject').value.trim(),
    detail: el('task-detail').value.trim(),
    assignDate: el('task-assign-date').value,
    dueDate: el('task-due-date').value,
    isPinned: false,
    submitted: [],
    extraUnsubmitted: []
  };

  if (!task.code || !task.subject || !task.detail || !task.dueDate) {
    alert('กรุณากรอกข้อมูลให้ครบ');
    return;
  }

  if (task.assignDate && task.dueDate < task.assignDate) {
    alert('วันส่งต้องไม่อยู่ก่อนวันสั่ง');
    return;
  }

  tasks.unshift(task);

  const success = await execute('กำลังบันทึกการบ้าน...', async () => {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'saveTasks', tasks: tasks })
    });
  });

  if (success) {
    ['task-code', 'task-subject', 'task-detail',
      'task-assign-date', 'task-due-date'].forEach(id => {
      el(id).value = '';
    });

    el('task-form').classList.add('hidden');
    renderTasks();
    renderCalendar();
    selectDate(selectedDate);
    setStatus('บันทึกการบ้านลง Google Sheets สำเร็จ');
    logActivity('เพิ่มการบ้าน', `${task.code} - ${task.subject} (${task.detail})`);
    alert('บันทึกการบ้านสำเร็จ');
  }
}

async function togglePin(id) {
  if (!requireAdmin()) return;
  const task = tasks.find(t => String(t.id) === String(id));
  if (task) {
    task.isPinned = !task.isPinned;
    renderTasks();
    renderCalendar();
    selectDate(selectedDate);
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'saveTasks', tasks: tasks })
    });
    logActivity('ปักหมุดงาน', `${task.subject} -> ${task.isPinned ? 'ปักหมุด' : 'ยกเลิกปักหมุด'}`);
  }
}

async function deleteTask(id) {
  if (!requireAdmin()) return;
  if (!confirm('ต้องการลบการบ้านนี้ใช่หรือไม่?')) return;

  const task = tasks.find(t => String(t.id) === String(id));
  tasks = tasks.filter(t => String(t.id) !== String(id));

  renderTasks();
  renderCalendar();
  selectDate(selectedDate);

  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'saveTasks', tasks: tasks })
  });

  if (task) logActivity('ลบการบ้าน', `${task.subject} (${task.detail})`);
}

async function toggleStudent(taskId, number) {
  if (!requireAdmin()) return;
  const task = tasks.find(t => String(t.id) === String(taskId));
  if (!task) return;
  if (!Array.isArray(task.submitted)) task.submitted = [];

  const numStr = String(number);
  const idx = task.submitted.indexOf(numStr);
  if (idx > -1) {
    task.submitted.splice(idx, 1);
  } else {
    task.submitted.push(numStr);
  }

  renderTasks();
  selectDate(selectedDate);

  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'saveTasks', tasks: tasks })
  });

  logActivity('อัปเดตส่งงาน', `เปลี่ยนสถานะเลขที่ ${numStr} ในวิชา ${task.subject}`);
}

async function addExtraStudent() {
  if (!requireAdmin()) return;

  const taskId = el('student-task-select').value;
  const number = el('student-number').value.trim();

  if (!taskId || !/^[1-9]\d*$/.test(number)) {
    alert('กรุณาเลือกงานและกรอกเลขที่ให้ถูกต้อง');
    return;
  }

  const task = tasks.find(t => String(t.id) === String(taskId));
  if (!task) return;
  if (!Array.isArray(task.extraUnsubmitted)) task.extraUnsubmitted = [];

  if (!task.extraUnsubmitted.includes(number)) {
    task.extraUnsubmitted.push(number);
    renderTasks();
    selectDate(selectedDate);
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'saveTasks', tasks: tasks })
    });
    logActivity('เพิ่มคนค้างงาน', `เลขที่ ${number} ในวิชา ${task.subject}`);
  }

  el('student-number').value = '';
  el('student-form').classList.add('hidden');
}

function renderCalendar() {
  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  el('calendar-month-year').textContent =
    calendarDate.toLocaleDateString('th-TH', {
      month: 'long',
      year: 'numeric'
    });

  const container = el('calendar-days');
  container.innerHTML = '';

  const firstDay = new Date(year, month, 1).getDay();
  const totalDays = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    container.appendChild(document.createElement('div'));
  }

  for (let day = 1; day <= totalDays; day++) {
    const key = dateKey(new Date(year, month, day));
    const button = document.createElement('button');

    button.textContent = day;
    button.className =
      'h-10 rounded-xl text-xs font-bold ' +
      (key === selectedDate
        ? 'bg-sky-400 text-white'
        : 'bg-slate-50 text-slate-700');

    button.onclick = () => selectDate(key);
    container.appendChild(button);
  }
}

function changeMonth(direction) {
  calendarDate = new Date(
    calendarDate.getFullYear(),
    calendarDate.getMonth() + direction,
    1
  );

  renderCalendar();
}

function selectDate(key) {
  selectedDate = key;
  renderCalendar();

  el('selected-date-label').textContent =
    'รายการวันที่ ' + formatDate(key);

  const container = el('selected-date-tasks');
  container.innerHTML = '';

  const matches = tasks.filter(task =>
    task.assignDate === key || task.dueDate === key
  );

  matches.forEach(task => container.appendChild(createTaskCard(task)));

  if (!matches.length) {
    container.innerHTML =
      '<p class="text-xs text-slate-400">ไม่มีการบ้านในวันนี้</p>';
  }

  const eventList = el('event-list');
  eventList.innerHTML = '';

  (dailyEvents[key] || []).forEach(event => {
    const p = document.createElement('p');
    p.className = 'bg-sky-50 rounded-xl p-2 text-xs';
    p.textContent = event;
    eventList.appendChild(p);
  });

  if (!eventList.children.length) {
    eventList.innerHTML =
      '<p class="text-xs text-slate-400">ไม่มีกิจกรรม</p>';
  }
}

async function addEvent() {
  if (!requireAdmin()) return;

  const event = el('event-input').value.trim();
  if (!event) return;

  if (!dailyEvents[selectedDate]) dailyEvents[selectedDate] = [];
  dailyEvents[selectedDate].push(event);

  selectDate(selectedDate);
  el('event-input').value = '';

  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'saveEvents', events: dailyEvents })
  });

  logActivity('เพิ่มกิจกรรม', `วันที่ ${selectedDate}: ${event}`);
}

function updateOptions() {
  el('code-options').innerHTML = '';
  el('subject-options').innerHTML = '';

  codes.forEach(code => {
    const option = document.createElement('option');
    option.value = code;
    el('code-options').appendChild(option);
  });

  subjects.forEach(subject => {
    const option = document.createElement('option');
    option.value = subject;
    el('subject-options').appendChild(option);
  });
}

function openModal(title, content) {
  el('modal-title').textContent = title;
  el('modal-content').innerHTML = content;
  el('modal').classList.remove('hidden');
}

function closeModal() {
  el('modal').classList.add('hidden');
}

function openOptions() {
  const content = `
    <div class="space-y-3">
      <input id="new-code" class="w-full border rounded-xl p-3 text-xs" placeholder="รหัสวิชา">
      <input id="new-subject" class="w-full border rounded-xl p-3 text-xs" placeholder="ชื่อวิชา">

      <button onclick="saveOption()" class="w-full bg-sky-500 text-white py-3 rounded-xl text-xs font-bold">
        เพิ่มวิชา
      </button>

      <h4 class="font-bold text-xs">รหัสวิชา</h4>
      <div id="option-codes" class="text-xs space-y-1 max-h-[120px] overflow-y-auto"></div>

      <h4 class="font-bold text-xs">ชื่อวิชา</h4>
      <div id="option-subjects" class="text-xs space-y-1 max-h-[120px] overflow-y-auto"></div>
    </div>
  `;

  openModal('จัดการรหัสวิชาและชื่อวิชา', content);

  codes.forEach(code => {
    const p = document.createElement('p');
    p.textContent = code;
    el('option-codes').appendChild(p);
  });

  subjects.forEach(subject => {
    const p = document.createElement('p');
    p.textContent = subject;
    el('option-subjects').appendChild(p);
  });
}

async function saveOption() {
  if (!requireAdmin()) return;

  const code = el('new-code').value.trim();
  const subject = el('new-subject').value.trim();

  if (!code && !subject) {
    alert('กรุณากรอกข้อมูลอย่างน้อยหนึ่งช่อง');
    return;
  }

  await execute('กำลังเพิ่มวิชา...', async () => {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'saveOption', code: code, subject: subject })
    });
    logActivity('เพิ่มวิชาใหม่', `รหัส: ${code}, วิชา: ${subject}`);
    await loadAllData(false);
  });

  openOptions();
}

async function openLogs() {
  openModal(
    'ประวัติการใช้งาน',
    '<p class="text-xs">กำลังโหลด...</p>'
  );

  try {
    const logs = await fetchJSON(`${SCRIPT_URL}?action=getLogs&t=${Date.now()}`);
    const container = el('modal-content');
    container.innerHTML = '';

    if (isAdmin()) {
      const clearButton = document.createElement('button');
      clearButton.className =
        'bg-rose-100 text-rose-600 rounded-xl px-3 py-2 text-xs font-bold mb-3';

      clearButton.textContent = 'ล้างประวัติทั้งหมด';
      clearButton.onclick = clearLogs;
      container.appendChild(clearButton);
    }

    if (Array.isArray(logs) && logs.length > 0) {
      logs.forEach(log => {
        const div = document.createElement('div');
        div.className = 'border-b py-3 text-xs';

        const title = document.createElement('p');
        title.className = 'font-bold';
        title.textContent = (log.username || 'System') + ' • ' + (log.actionText || log.action || '-');

        const details = document.createElement('p');
        details.className = 'text-slate-500 mt-1';
        details.textContent = log.details || '';

        const time = document.createElement('p');
        time.className = 'text-slate-400 mt-1';
        time.textContent = log.timestamp ? new Date(log.timestamp).toLocaleString('th-TH') : '-';

        div.append(title, details, time);
        container.appendChild(div);
      });
    } else {
      container.innerHTML = '<p class="text-xs text-slate-400">ไม่มีประวัติการใช้งาน</p>';
    }
  } catch (error) {
    el('modal-content').textContent = error.message;
  }
}

async function clearLogs() {
  if (!requireAdmin()) return;
  if (!confirm('ล้างประวัติทั้งหมดใช่หรือไม่?')) return;

  await execute('กำลังล้างประวัติ...', async () => {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'clearLogs' })
    });
  });

  openLogs();
}

function logActivity(actionText, details) {
  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'saveLog',
      username: currentUser ? currentUser.username : 'Unknown',
      actionText: actionText,
      details: details
    })
  }).catch(e => console.error('Log Error:', e));
}

['click', 'touchstart', 'keydown', 'scroll'].forEach(eventName => {
  window.addEventListener(eventName, () => {
    lastActivity = Date.now();
  }, { passive: true });
});

setInterval(() => {
  if (currentUser && Date.now() - lastActivity > IDLE_TIMEOUT) {
    alert('หมดเวลาใช้งาน กรุณาเข้าสู่ระบบใหม่');
    logout();
  }
}, 30000);

document.addEventListener('DOMContentLoaded', async () => {
  const saved = sessionStorage.getItem('homeworkUser');

  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      el('login-page').classList.add('hidden');
      el('main-page').classList.remove('hidden');
      el('user-display').textContent = currentUser.name + ' • ' + currentUser.role.toUpperCase();
      await loadAllData(false);
    } catch (error) {
      console.error(error);
      sessionStorage.removeItem('homeworkUser');
    }
  }
});
</script>
